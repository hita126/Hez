name: 功能建议
description: 提议一个更适合 Hez 的新能力或体验改进
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先描述真实使用场景，而不是只写希望增加的按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 Hez 如何帮助你完成这件事？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方式
      description: 可选；说明现在如何完成，以及哪里不够顺手。
  - type: dropdown
    id: scope
    attributes:
      label: 相关范围
      options:
        - Hez 主界面与通用设置
        - Codex 用量
        - 启动台
        - 平滑鼠标
        - 右键增强
        - 新功能方向
    validations:
      required: true
