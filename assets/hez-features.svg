<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Hez 四项核心功能</title>
  <desc id="desc">Codex 用量、启动台、平滑鼠标和 Finder 右键增强的功能示意图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101419"/>
      <stop offset="1" stop-color="#202934"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bde8ff"/>
      <stop offset="1" stop-color="#78c8e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1400" height="820" rx="40" fill="url(#bg)"/>
  <circle cx="1170" cy="-80" r="370" fill="#3ba3cf" opacity=".09"/>
  <circle cx="30" cy="850" r="360" fill="#7c9cff" opacity=".07"/>

  <text x="70" y="78" fill="#f7fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="31" font-weight="700">四项能力，一个安静的工具盒。</text>
  <text x="70" y="116" fill="#9facb9" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17">功能示意 · 演示数据不代表真实账户信息</text>

  <!-- Codex Usage -->
  <g transform="translate(70 160)" filter="url(#shadow)">
    <rect width="600" height="260" rx="28" fill="#f8fafc"/>
    <circle cx="56" cy="54" r="24" fill="#e4f5fc"/>
    <path d="M43 54h26M47 47v14M53 43v22M59 48v12M65 45v18" stroke="#397e9e" stroke-width="3" stroke-linecap="round"/>
    <text x="94" y="50" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="23" font-weight="700">Codex 用量</text>
    <text x="94" y="76" fill="#65717d" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">额度、重置时间与刷新状态</text>
    <text x="36" y="137" fill="#17202a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="38" font-weight="700">47%</text>
    <text x="532" y="133" text-anchor="end" fill="#687580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">5 小时</text>
    <rect x="36" y="153" width="528" height="12" rx="6" fill="#dfe5e9"/>
    <rect x="36" y="153" width="248" height="12" rx="6" fill="url(#accent)"/>
    <text x="36" y="204" fill="#17202a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="28" font-weight="650">44%</text>
    <text x="532" y="201" text-anchor="end" fill="#687580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">1 周</text>
    <rect x="36" y="219" width="528" height="10" rx="5" fill="#dfe5e9"/>
    <rect x="36" y="219" width="232" height="10" rx="5" fill="#8fb9cd"/>
  </g>

  <!-- Launcher -->
  <g transform="translate(730 160)" filter="url(#shadow)">
    <rect width="600" height="260" rx="28" fill="#f8fafc"/>
    <circle cx="56" cy="54" r="24" fill="#eef0ff"/>
    <g fill="#5967a2"><circle cx="49" cy="47" r="3"/><circle cx="63" cy="47" r="3"/><circle cx="49" cy="61" r="3"/><circle cx="63" cy="61" r="3"/></g>
    <text x="94" y="50" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="23" font-weight="700">启动台</text>
    <text x="94" y="76" fill="#65717d" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">搜索、分类并快速打开应用</text>
    <rect x="36" y="104" width="528" height="42" rx="14" fill="#edf1f4"/>
    <circle cx="59" cy="125" r="8" fill="none" stroke="#8b969e" stroke-width="2"/><path d="m65 131 6 6" stroke="#8b969e" stroke-width="2" stroke-linecap="round"/>
    <text x="83" y="131" fill="#8b969e" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">搜索应用、文件、命令…</text>
    <g transform="translate(36 169)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle">
      <rect width="52" height="52" rx="14" fill="#d7ebf8"/><text x="26" y="34" fill="#2f7191" font-size="20">H</text>
      <rect x="78" width="52" height="52" rx="14" fill="#e3e8ff"/><text x="104" y="34" fill="#58659d" font-size="20">E</text>
      <rect x="156" width="52" height="52" rx="14" fill="#e6f3e9"/><text x="182" y="34" fill="#4d8260" font-size="20">Z</text>
      <rect x="234" width="52" height="52" rx="14" fill="#f5e8df"/><text x="260" y="34" fill="#9a6948" font-size="20">⌘</text>
      <rect x="312" width="52" height="52" rx="14" fill="#e9e9ed"/><text x="338" y="34" fill="#555b62" font-size="20">A</text>
      <rect x="390" width="52" height="52" rx="14" fill="#e1f1f2"/><text x="416" y="34" fill="#4c8084" font-size="20">+</text>
    </g>
  </g>

  <!-- Mouse -->
  <g transform="translate(70 470)" filter="url(#shadow)">
    <rect width="600" height="280" rx="28" fill="#f8fafc"/>
    <circle cx="56" cy="54" r="24" fill="#e8f5ec"/>
    <path d="M56 39c-8 0-13 6-13 14v5c0 9 5 15 13 15s13-6 13-15v-5c0-8-5-14-13-14Zm0 0v12" fill="none" stroke="#4b8763" stroke-width="3" stroke-linecap="round"/>
    <text x="94" y="50" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="23" font-weight="700">平滑鼠标</text>
    <text x="94" y="76" fill="#65717d" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">机械滚轮获得稳定、细腻的滚动</text>
    <rect x="36" y="108" width="528" height="100" rx="18" fill="#eef2f3"/>
    <path d="M53 174h48v-41h48v41h48v-26h48v26h48v-17h48v17h48" fill="none" stroke="#bdc5ca" stroke-width="3"/>
    <path d="M53 174c30 0 27-42 72-42s40 42 76 42 38-27 74-27 36 27 72 27 37-17 74-17 38 17 73 17" fill="none" stroke="#4695b7" stroke-width="4" stroke-linecap="round"/>
    <text x="36" y="249" fill="#687580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">滚动方向</text>
    <text x="564" y="249" text-anchor="end" fill="#17202a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="600">独立设置</text>
  </g>

  <!-- RightClick -->
  <g transform="translate(730 470)" filter="url(#shadow)">
    <rect width="600" height="280" rx="28" fill="#f8fafc"/>
    <circle cx="56" cy="54" r="24" fill="#f4ece7"/>
    <path d="m47 39 18 24-10 1-5 9-3-34Z" fill="none" stroke="#95684e" stroke-width="3" stroke-linejoin="round"/>
    <text x="94" y="50" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="23" font-weight="700">Finder 右键增强</text>
    <text x="94" y="76" fill="#65717d" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">常用文件操作留在右键菜单</text>
    <g transform="translate(36 108)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17">
      <rect width="528" height="136" rx="18" fill="#eef2f3"/>
      <text x="24" y="34" fill="#26313a">复制路径</text><text x="494" y="34" text-anchor="end" fill="#89949d">⌘ ⇧ C</text>
      <path d="M20 48h488" stroke="#d6dcdf"/>
      <text x="24" y="80" fill="#26313a">新建文件</text><text x="494" y="80" text-anchor="end" fill="#89949d">›</text>
      <path d="M20 94h488" stroke="#d6dcdf"/>
      <text x="24" y="124" fill="#26313a">计算 SHA-256</text><circle cx="494" cy="118" r="5" fill="#5aa176"/>
    </g>
  </g>
</svg>
